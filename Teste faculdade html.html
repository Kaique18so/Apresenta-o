<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Ídolo Antigo Jaspion</title>
    <style>
        body {
            background-color: #e90000;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            color: white;
        }

        header {
            text-align: center;
            padding: 20px;
        }

        header h1 {
            font-size: 2.5em;
            text-transform: uppercase;
            text-decoration: underline;
            color: #fff;
        }

        .banner img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.6);
        }

        section {
            text-align: center;
            margin-top: 30px;
        }

        section h2 {
            color: yellow;
            text-decoration: underline;
            font-size: 2em;
        }

        ul {
            list-style-type: square;
            display: inline-block;
            text-align: left;
            font-size: 1.2em;
            margin-top: 15px;
        }

        ul li {
            margin: 8px 0;
        }

        .gallery img {
            height: 250px;
            margin: 15px;
            border-radius: 8px;
            border: 3px solid #fff;
            transition: transform 0.3s;
        }

        .gallery img:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <header>
        <h1>Fantástico Jaspion</h1>
        <div class="banner">
            <img src="https://i0.wp.com/images-na.ssl-images-amazon.com/images/S/pv-target-images/ef5e31b8b9966c12dc1d1c55e6f6dee1d41f363c11e245ff0aa1a8a54e86dbc5._V_SX1080_.jpg?resize=1080%2C608&ssl=1" alt="Jaspion">
        </div>
    </header>

    <section>
        <div class="gallery">
            <img src="https://tokusatsu.blog.br/wp-content/uploads/2017/11/jaspion-1-1.jpg" alt="Jaspion em ação">
        </div>
        <h2>Suas Habilidades e Armas</h2>
        <ul>
            <li>Super Força</li>
            <li>Armadura Forte</li>
            <li>Espada a Laser</li>
            <li>Arma a Laser</li>
            <li>Gaibin Tanque e Jet</li>
            <li>Moto Space</li>
            <li>Robô Gigante Ultra Forte (Daileon)</li>
        </ul>
    </section>
</body>
</html>
